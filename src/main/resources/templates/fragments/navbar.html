<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="Application de gestion de bibliothèque">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Bibliothèque">
</head>
<body>

<!-- FRAGMENT : Navbar réutilisable -->
<nav class="navbar" th:fragment="navbar">
    <div class="container">
        <a href="/" class="navbar-brand">
            <span class="logo-icon">📚</span>
            <span>Bibliothèque</span>
        </a>

        <div class="navbar-nav">
            <a href="/" class="nav-link" 
               th:classappend="${active == 'accueil'} ? 'active'">
                <i>🏠</i> Accueil
            </a>
            <a href="/livres" class="nav-link"
               th:classappend="${active == 'livres'} ? 'active'">
                <i>📚</i> Livres
            </a>
            <a href="/emprunts" class="nav-link"
               th:classappend="${active == 'emprunts'} ? 'active'">
                <i>📋</i> Emprunts
            </a>
            <a href="/reservations" class="nav-link"
               th:classappend="${active == 'reservations'} ? 'active'">
                <i>📅</i> Réservations
            </a>
            <a href="/amendes" class="nav-link"
               th:classappend="${active == 'amendes'} ? 'active'">
                <i>💰</i> Amendes
            </a>

            <div class="dropdown" th:if="${#authorization.expression('hasRole(''BIB'')')}">
                <button class="nav-link dropdown-toggle">
                    <i>⚙️</i> Admin
                </button>
                <div class="dropdown-menu">
                    <a href="/dashboard" class="dropdown-item">📊 Dashboard</a>
                    <a href="/utilisateurs" class="dropdown-item">👥 Utilisateurs</a>
                    <a href="/journal" class="dropdown-item">📜 Journal d'audit</a>
                    <a href="/rapports" class="dropdown-item">📄 Rapports PDF</a>
                </div>
            </div>
        </div>

        <div class="navbar-right">
            <button class="theme-toggle" onclick="toggleTheme()" title="Mode sombre/clair">🌙</button>
            <a href="/profil" class="user-badge" style="text-decoration: none; cursor: pointer;"
               title="Mon profil">
                <div class="avatar" th:text="${#authentication.name.substring(0,1).toUpperCase()}">A</div>
                <span th:text="${#authentication.name}">admin@biblio.com</span>
            </a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="nav-link btn-logout">
                    <i>🚪</i> Déconnexion
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- FRAGMENT : Footer -->
<footer th:fragment="footer" style="background: var(--bg-card); border-top: 1px solid var(--border);
        padding: 24px; text-align: center; margin-top: 60px; color: var(--text-secondary);
        font-size: 13px;">
    <div style="max-width: 1320px; margin: 0 auto;">
        <p style="margin-bottom: 8px;">
            📚 Bibliothèque Municipale — © <span th:text="${#temporals.year(#temporals.createNow())}">2026</span>
        </p>
        <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
            <a href="/mentions-legales" style="color: inherit;">Mentions légales</a>
            <a href="/cgu" style="color: inherit;">CGU</a>
            <a href="/confidentialite" style="color: inherit;">Confidentialité</a>
        </div>
    </div>
</footer>

<!-- FRAGMENT : Scripts communs -->
<th:block th:fragment="scripts">
    <script th:src="@{/js/pwa-register.js}"></script>
    <script>
    function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme');
        const newTheme = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        document.querySelector('.theme-toggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
    }
    (function() {
        const saved = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.querySelector('.theme-toggle');
            if (btn) btn.textContent = saved === 'dark' ? '☀️' : '🌙';
        });
    })();
    </script>
</th:block>

<!-- FRAGMENT : Script thème (compatibilité) -->
<script th:fragment="themeScript">
function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const newTheme = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    document.querySelector('.theme-toggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
}
(function() {
    const saved = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    document.addEventListener('DOMContentLoaded', () => {
        const btn = document.querySelector('.theme-toggle');
        if (btn) btn.textContent = saved === 'dark' ? '☀️' : '🌙';
    });
})();
</script>

</body>
</html>
