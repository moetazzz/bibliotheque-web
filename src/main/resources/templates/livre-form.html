<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livre</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-main fade-in">

    <div class="page-header" style="justify-content: center; text-align: center;">
        <div>
            <h1 class="page-title" th:text="${livre.id != null ? '✏️ Modifier un livre' : '➕ Ajouter un livre'}">
                Ajouter un livre
            </h1>
            <p class="page-subtitle">Remplissez les informations du livre</p>
        </div>
    </div>

    <div class="form-card">
        <form th:action="@{/livres}" th:object="${livre}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-grid">
                <div class="form-group full">
                    <label class="form-label">Titre <span style="color: var(--danger);">*</span></label>
                    <div class="input-icon" data-icon="📖">
                        <input type="text" class="form-control" th:field="*{titre}"
                               placeholder="Ex : Le Petit Prince">
                    </div>
                    <div style="color: var(--danger); font-size: 12px; margin-top: 4px;"
                         th:if="${#fields.hasErrors('titre')}" th:errors="*{titre}"></div>
                </div>

                <div class="form-group full">
                    <label class="form-label">Auteur <span style="color: var(--danger);">*</span></label>
                    <div class="input-icon" data-icon="✍️">
                        <input type="text" class="form-control" th:field="*{auteur}"
                               placeholder="Ex : Antoine de Saint-Exupéry">
                    </div>
                    <div style="color: var(--danger); font-size: 12px; margin-top: 4px;"
                         th:if="${#fields.hasErrors('auteur')}" th:errors="*{auteur}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">ISBN</label>
                    <div class="input-icon" data-icon="🔢">
                        <input type="text" class="form-control" th:field="*{isbn}"
                               placeholder="978-2-07-040850-4">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Année de publication</label>
                    <div class="input-icon" data-icon="📅">
                        <input type="number" class="form-control" th:field="*{anneePublication}"
                               placeholder="1943" min="0" max="2100">
                    </div>
                    <div style="color: var(--danger); font-size: 12px; margin-top: 4px;"
                         th:if="${#fields.hasErrors('anneePublication')}" th:errors="*{anneePublication}"></div>
                </div>

                <div class="form-group full">
                    <label class="form-label">Catégorie</label>
                    <div class="input-icon" data-icon="🏷️">
                        <select class="form-select" th:field="*{categorie}">
                            <option value="">-- Choisir une catégorie --</option>
                            <option value="ROMAN">📕 Roman</option>
                            <option value="SCIENCE_FICTION">🚀 Science-Fiction</option>
                            <option value="BIOGRAPHIE">👤 Biographie</option>
                            <option value="HISTOIRE">🏛️ Histoire</option>
                            <option value="JEUNESSE">🧒 Jeunesse</option>
                            <option value="BD">💬 Bande dessinée</option>
                            <option value="AUTRE">📚 Autre</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <a href="/livres" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-success">💾 Enregistrer</button>
            </div>

        </form>
    </div>

</div>

<script th:replace="~{fragments/navbar :: themeScript}"></script>
</body>
</html>
