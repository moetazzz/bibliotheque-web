<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un livre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">📚 Bibliothèque Municipale</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm">Accueil</a>
            <a href="/dashboard" class="btn btn-outline-light btn-sm">📊 Dashboard</a>
            <a href="/livres" class="btn btn-outline-light btn-sm">Livres</a>
            <a href="/utilisateurs" class="btn btn-outline-light btn-sm">Utilisateurs</a>
            <a href="/emprunts" class="btn btn-outline-light btn-sm">Emprunts</a>
            <a href="/amendes" class="btn btn-outline-light btn-sm">💰 Amendes</a>
            <form th:action="@{/logout}" method="post" style="display:inline-block;">
                <button type="submit" class="btn btn-outline-warning btn-sm">🚪 Déconnexion</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4" style="max-width: 700px;">

    <h1 class="mb-4" th:text="${livre.id != null ? '✏️ Modifier un livre' : '➕ Ajouter un livre'}">
        Ajouter un livre
    </h1>

    <!-- Formulaire -->
    <form th:action="@{/livres}" th:object="${livre}" method="post">
        <input type="hidden" th:field="*{id}">

        <!-- Titre -->
        <div class="mb-3">
            <label for="titre" class="form-label">Titre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="titre" th:field="*{titre}" 
                   placeholder="Ex : Le Petit Prince">
            <div class="text-danger small" th:if="${#fields.hasErrors('titre')}" 
                 th:errors="*{titre}"></div>
        </div>

        <!-- Auteur -->
        <div class="mb-3">
            <label for="auteur" class="form-label">Auteur <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="auteur" th:field="*{auteur}"
                   placeholder="Ex : Antoine de Saint-Exupéry">
            <div class="text-danger small" th:if="${#fields.hasErrors('auteur')}" 
                 th:errors="*{auteur}"></div>
        </div>

        <!-- ISBN -->
        <div class="mb-3">
            <label for="isbn" class="form-label">ISBN</label>
            <input type="text" class="form-control" id="isbn" th:field="*{isbn}"
                   placeholder="Ex : 978-2-07-040850-4">
        </div>

        <!-- Catégorie -->
        <div class="mb-3">
            <label for="categorie" class="form-label">Catégorie</label>
            <select class="form-select" id="categorie" th:field="*{categorie}">
                <option value="">-- Choisir --</option>
                <option value="ROMAN">Roman</option>
                <option value="SCIENCE_FICTION">Science-Fiction</option>
                <option value="BIOGRAPHIE">Biographie</option>
                <option value="HISTOIRE">Histoire</option>
                <option value="JEUNESSE">Jeunesse</option>
                <option value="BD">Bande dessinée</option>
                <option value="AUTRE">Autre</option>
            </select>
        </div>

        <!-- Année -->
        <div class="mb-3">
            <label for="anneePublication" class="form-label">Année de publication</label>
            <input type="number" class="form-control" id="anneePublication" 
                   th:field="*{anneePublication}" placeholder="Ex : 1943" min="0" max="2100">
            <div class="text-danger small" th:if="${#fields.hasErrors('anneePublication')}" 
                 th:errors="*{anneePublication}"></div>
        </div>

        <!-- Boutons -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">💾 Enregistrer</button>
            <a href="/livres" class="btn btn-secondary">Annuler</a>
        </div>

    </form>

</div>

</body>
</html>
