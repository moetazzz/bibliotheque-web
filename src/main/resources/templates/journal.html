<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bibliothèque</title>
    <th:block th:replace="~{fragments/navbar :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- AJOUTEZ CES LIGNES POUR LA PWA -->
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-main fade-in">

    <div class="page-header">
        <div>
            <h1 class="page-title">📜 Journal d'audit</h1>
            <p class="page-subtitle">Historique complet des actions</p>
        </div>
        <span class="badge badge-primary" style="font-size: 14px; padding: 8px 16px;">
            <span th:text="${#lists.size(entrees)}">0</span> actions
        </span>
    </div>

    <div class="table-container" th:if="${!#lists.isEmpty(entrees)}">
        <table class="table-modern">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Date</th>
                    <th>Utilisateur</th>
                    <th>Action</th>
                    <th>Détails</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="entry : ${entrees}">
                    <td><span class="badge badge-gray" th:text="${entry.id}">1</span></td>
                    <td th:text="${#temporals.format(entry.dateAction, 'dd/MM/yyyy HH:mm:ss')}">01/01/2026 12:00</td>
                    <td><strong th:text="${entry.nomUtilisateur}">Alice</strong></td>
                    <td>
                        <span class="badge"
                              th:classappend="${entry.action.startsWith('AJOUT')} ? 'badge-success' :
                                               (${entry.action.startsWith('SUPPR')} ? 'badge-danger' : 'badge-info')"
                              th:text="${entry.action}">EMPRUNT</span>
                    </td>
                    <td th:text="${entry.details}">—</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card" th:if="${#lists.isEmpty(entrees)}">
        <div class="empty-state">
            <div class="empty-icon">📜</div>
            <h3>Aucune action enregistrée</h3>
            <p>Les actions apparaîtront ici.</p>
        </div>
    </div>

</div>
<div th:replace="~{fragments/navbar :: footer}"></div>
<script th:replace="~{fragments/navbar :: themeScript}"></script>
<script th:src="@{/js/pwa-register.js}"></script>
</body>
</html>
