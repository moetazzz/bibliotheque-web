<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emprunts</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-main fade-in">

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${historique != null ? '📜 Historique' : '📋 Emprunts en cours'}">
                Emprunts
            </h1>
            <p class="page-subtitle" th:text="${historique != null ? 'Tous les emprunts' : 'Emprunts actuellement en cours'}">
                Emprunts
            </p>
        </div>
        <div style="display: flex; gap: 10px;">
            <a href="/emprunts/nouveau" class="btn btn-success"
               th:if="${#authorization.expression('hasRole(''BIB'')')}">➕ Nouvel emprunt</a>
            <a th:if="${historique == null}" href="/emprunts/historique" class="btn btn-secondary">📜 Historique</a>
            <a th:if="${historique != null}" href="/emprunts" class="btn btn-secondary">📋 En cours</a>
        </div>
    </div>

    <div class="alert alert-success" th:if="${message}">
        ✅ <span th:text="${message}"></span>
    </div>
    <div class="alert alert-danger" th:if="${erreur}">
        ❌ <span th:text="${erreur}"></span>
    </div>

    <div class="table-container" th:if="${!#lists.isEmpty(emprunts)}">
        <table class="table-modern">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Livre</th>
                    <th>Emprunteur</th>
                    <th>Date emprunt</th>
                    <th>Retour prévu</th>
                    <th>Retour effectif</th>
                    <th>Statut</th>
                    <th style="text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="emprunt : ${emprunts}">
                    <td><span class="badge badge-gray" th:text="${emprunt.id}">1</span></td>
                    <td><strong th:text="${emprunt.livre.titre}">Titre</strong></td>
                    <td th:text="${emprunt.utilisateur.nom}">Alice</td>
                    <td th:text="${#temporals.format(emprunt.dateEmprunt, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td th:text="${#temporals.format(emprunt.dateRetourPrevue, 'dd/MM/yyyy')}">15/01/2026</td>
                    <td th:text="${emprunt.dateRetourEffective != null ? #temporals.format(emprunt.dateRetourEffective, 'dd/MM/yyyy') : '—'}">—</td>
                    <td>
                        <span th:if="${emprunt.statut == 'EN_COURS'}" class="badge badge-primary">📤 En cours</span>
                        <span th:if="${emprunt.statut == 'EN_RETARD'}" class="badge badge-danger">
                            ⚠️ Retard <span th:text="${emprunt.joursDeRetard()}">X</span> j
                        </span>
                        <span th:if="${emprunt.statut == 'RENDU'}" class="badge badge-success">✅ Rendu</span>
                    </td>
                    <td style="text-align: center; white-space: nowrap;">
                        <form th:if="${!emprunt.estRendu()}"
                              th:action="@{/emprunts/{id}/retourner(id=${emprunt.id})}"
                              method="post" style="display:inline-block;">
                            <button type="submit" class="btn btn-primary btn-sm"
                                    onclick="return confirm('Confirmer le retour ?');">📥 Retourner</button>
                        </form>
                        <form th:if="${!emprunt.estRendu() and emprunt.prolongations < 1}"
                              th:action="@{/emprunts/{id}/prolonger(id=${emprunt.id})}"
                              method="post" style="display:inline-block;">
                            <button type="submit" class="btn btn-warning btn-sm"
                                    onclick="return confirm('Prolonger de 7 jours ?');">⏩ Prolonger</button>
                        </form>
                        <form th:if="${#authorization.expression('hasRole(''BIB'')')}"
                              th:action="@{/emprunts/{id}/supprimer(id=${emprunt.id})}"
                              method="post" style="display:inline-block;"
                              onsubmit="return confirm('Supprimer cet emprunt ?');">
                            <button type="submit" class="btn btn-danger btn-icon btn-sm">🗑️</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card" th:if="${#lists.isEmpty(emprunts)}">
        <div class="empty-state">
            <div class="empty-icon">📋</div>
            <h3>Aucun emprunt</h3>
            <p>Les emprunts apparaîtront ici.</p>
        </div>
    </div>

</div>

<script th:replace="~{fragments/navbar :: themeScript}"></script>
</body>
</html>
