<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accueil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">📚 Bibliothèque Municipale</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm">Accueil</a>
            <a href="/dashboard" class="btn btn-outline-light btn-sm">📊 Dashboard</a>
            <a href="/livres" class="btn btn-outline-light btn-sm">Livres</a>
            <a href="/utilisateurs" class="btn btn-outline-light btn-sm"
               th:if="${#authorization.expression('hasRole(''BIB'')')}">Utilisateurs</a>
            <a href="/emprunts" class="btn btn-outline-light btn-sm">Emprunts</a>
            <a href="/amendes" class="btn btn-outline-light btn-sm">💰 Amendes</a>
            <form th:action="@{/logout}" method="post" style="display:inline-block;">
                <button type="submit" class="btn btn-outline-warning btn-sm">🚪 Déconnexion</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="text-center">
        <h1 class="display-3">📚 Bibliothèque Municipale</h1>
        <p class="lead">Bienvenue sur l'application de gestion de bibliothèque !</p>

        <hr class="my-4">

        <div class="d-grid gap-2 col-6 mx-auto mt-4">
            <a href="/livres" class="btn btn-primary btn-lg">📖 Voir les livres</a>
            <a href="/emprunts" class="btn btn-success btn-lg">📋 Voir les emprunts</a>
            <a href="/utilisateurs" class="btn btn-secondary btn-lg"
               th:if="${#authorization.expression('hasRole(''BIB'')')}">
                👥 Voir les utilisateurs
            </a>
        </div>
    </div>
</div>

</body>
</html>
