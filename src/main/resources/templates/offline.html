<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne - Bibliothèque</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center;
             min-height: 100vh; text-align: center; padding: 20px;
             background: var(--bg-body);">

    <div style="max-width: 500px;">
        <div style="font-size: 100px; margin-bottom: 24px;">📶</div>

        <h1 style="font-size: 36px; margin-bottom: 16px; color: var(--text-primary);">
            Vous êtes hors ligne
        </h1>

        <p style="color: var(--text-secondary); font-size: 16px;
                  line-height: 1.6; margin-bottom: 32px;">
            Vérifiez votre connexion internet. Certaines pages déjà visitées
            restent accessibles grâce au cache.
        </p>

        <button onclick="location.reload()" class="btn btn-primary"
                style="padding: 14px 28px; font-size: 15px;">
            🔄 Réessayer
        </button>

        <div style="margin-top: 40px; padding-top: 24px;
                    border-top: 1px solid var(--border);
                    color: var(--text-muted); font-size: 13px;">
            📚 Bibliothèque Municipale
        </div>
    </div>

</body>
</html>
