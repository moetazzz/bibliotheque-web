<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amendes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-main fade-in">

    <div class="page-header">
        <div>
            <h1 class="page-title">💰 <span th:text="${vue == 'BIB'} ? 'Toutes les amendes' : 'Mes amendes'">Amendes</span></h1>
            <p class="page-subtitle">Gestion des pénalités de retard</p>
        </div>

        <div th:if="${vue == 'MEMBRE'}" class="stat-card" style="min-width: 200px; padding: 16px;">
            <div class="stat-label">Solde actuel</div>
            <div class="stat-value"
                 th:style="'color:' + (${utilisateur.soldeAmendes > 0} ? 'var(--danger)' : 'var(--success)')"
                 th:text="${#numbers.formatDecimal(utilisateur.soldeAmendes, 1, 2)} + ' €'">0.00 €</div>
            <form th:action="@{/amendes/payer}" method="post" class="mt-2"
                  th:if="${utilisateur.soldeAmendes > 0}">
                <button type="submit" class="btn btn-warning w-100"
                        onclick="return confirm('Payer toutes vos amendes ?');">
                    💳 Payer tout
                </button>
            </form>
        </div>
    </div>

    <div class="alert alert-success" th:if="${message}">
        <span th:text="${message}"></span>
    </div>

    <div class="alert alert-danger" th:if="${vue == 'MEMBRE' and utilisateur.soldeAmendes >= 10.0}">
        🚫 <strong>Attention !</strong> Votre solde dépasse 10€. Vous ne pouvez plus emprunter.
    </div>

    <div class="table-container" th:if="${!#lists.isEmpty(amendes)}">
        <table class="table-modern">
            <thead>
                <tr>
                    <th>ID</th>
                    <th th:if="${vue == 'BIB'}">Utilisateur</th>
                    <th>Livre</th>
                    <th>Montant</th>
                    <th>Date</th>
                    <th>Statut</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="amende : ${amendes}">
                    <td><span class="badge badge-gray" th:text="${amende.id}">1</span></td>
                    <td th:if="${vue == 'BIB'}" th:text="${amende.utilisateur.nom}">Alice</td>
                    <td th:text="${amende.emprunt.livre.titre}">Titre</td>
                    <td>
                        <strong style="color: var(--danger);">
                            <span th:text="${#numbers.formatDecimal(amende.montant, 1, 2)}">0.00</span> €
                        </strong>
                    </td>
                    <td th:text="${#temporals.format(amende.dateCreation, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td>
                        <span th:if="${amende.payee}" class="badge badge-success">✅ Payée</span>
                        <span th:unless="${amende.payee}" class="badge badge-danger">❌ Impayée</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card" th:if="${#lists.isEmpty(amendes)}">
        <div class="empty-state">
            <div class="empty-icon">💰</div>
            <h3>Aucune amende</h3>
            <p>Vous n'avez aucune amende à payer.</p>
        </div>
    </div>

</div>

<script th:replace="~{fragments/navbar :: themeScript}"></script>
</body>
</html>
