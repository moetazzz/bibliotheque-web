<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-main fade-in" style="max-width: 900px;">

    <div class="page-header">
        <div>
            <h1 class="page-title">👤 Mon profil</h1>
            <p class="page-subtitle">Gérez vos informations personnelles</p>
        </div>
    </div>

    <div class="alert alert-success" th:if="${message}">
        <span th:text="${message}"></span>
    </div>
    <div class="alert alert-danger" th:if="${erreur}">
        <span th:text="${erreur}"></span>
    </div>

    <!-- CARTE PROFIL -->
    <div class="card" style="margin-bottom: 24px;">
        <div style="display: flex; align-items: center; gap: 24px; padding: 32px;">

            <div style="width: 90px; height: 90px; border-radius: 50%;
                        background: linear-gradient(135deg, #6366f1, #8b5cf6);
                        display: flex; align-items: center; justify-content: center;
                        color: white; font-size: 36px; font-weight: 800;
                        box-shadow: 0 8px 24px rgba(99,102,241,0.3); flex-shrink: 0;"
                 th:text="${#strings.substring(utilisateur.nom, 0, 1).toUpperCase()}">A</div>

            <div style="flex: 1;">
                <h2 style="margin: 0 0 4px; font-size: 24px;"
                    th:text="${utilisateur.nom}">Alice</h2>
                <p style="margin: 0; color: var(--text-secondary); font-size: 14px;"
                   th:text="${utilisateur.email}">alice@mail.com</p>
                <div style="margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap;">
                    <span class="badge badge-primary" th:text="${utilisateur.roleLibelle}">Membre</span>
                    <span class="badge badge-info">
                        📋 <span th:text="${empruntsEnCours}">0</span> emprunt(s) en cours
                    </span>
                    <span class="badge"
                          th:classappend="${utilisateur.soldeAmendes > 0} ? 'badge-danger' : 'badge-success'">
                        💰 <span th:text="${#numbers.formatDecimal(utilisateur.soldeAmendes, 1, 2)}">0.00</span> €
                    </span>
                </div>
            </div>

        </div>
    </div>

    <!-- MODIFIER LES INFOS -->
    <div class="card" style="margin-bottom: 24px;">
        <div class="card-header">
            <h3 class="card-title">✏️ Modifier mes informations</h3>
        </div>
        <div class="card-body">

            <form th:action="@{/profil/infos}" method="post">

                <div class="form-grid">
                    <div class="form-group full">
                        <label class="form-label">Nom complet</label>
                        <div class="input-icon" data-icon="👤">
                            <input type="text" name="nom" class="form-control"
                                   th:value="${utilisateur.nom}" required>
                        </div>
                    </div>

                    <div class="form-group full">
                        <label class="form-label">Adresse email</label>
                        <div class="input-icon" data-icon="📧">
                            <input type="email" name="email" class="form-control"
                                   th:value="${utilisateur.email}" required>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-success">💾 Enregistrer</button>
                </div>

            </form>

        </div>
    </div>

    <!-- CHANGER MOT DE PASSE -->
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">🔒 Changer mon mot de passe</h3>
        </div>
        <div class="card-body">

            <div class="alert alert-warning">
                ⚠️ Choisissez un mot de passe <strong>fort</strong> : au moins 6 caractères,
                avec majuscules, minuscules et chiffres.
            </div>

            <form th:action="@{/profil/mot-de-passe}" method="post">

                <div class="form-grid">
                    <div class="form-group full">
                        <label class="form-label">Ancien mot de passe</label>
                        <div class="input-icon" data-icon="🔓">
                            <input type="password" name="ancien" class="form-control"
                                   placeholder="Votre mot de passe actuel" required>
                        </div>
                    </div>

                    <div class="form-group full">
                        <label class="form-label">Nouveau mot de passe</label>
                        <div class="input-icon" data-icon="🔒">
                            <input type="password" name="nouveau" class="form-control"
                                   placeholder="Minimum 6 caractères"
                                   minlength="6" required>
                        </div>
                    </div>

                    <div class="form-group full">
                        <label class="form-label">Confirmer le nouveau mot de passe</label>
                        <div class="input-icon" data-icon="🔒">
                            <input type="password" name="confirmation" class="form-control"
                                   placeholder="Retapez le nouveau mot de passe"
                                   minlength="6" required>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        🔐 Changer le mot de passe
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<script th:replace="~{fragments/navbar :: themeScript}"></script>
</body>
</html>
