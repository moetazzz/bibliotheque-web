<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouvel emprunt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">📚 Bibliothèque Municipale</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm">Accueil</a>
            <a href="/dashboard" class="btn btn-outline-light btn-sm">📊 Dashboard</a>
            <a href="/livres" class="btn btn-outline-light btn-sm">Livres</a>
            <a href="/utilisateurs" class="btn btn-outline-light btn-sm">Utilisateurs</a>
            <a href="/emprunts" class="btn btn-outline-light btn-sm">Emprunts</a>
            <a href="/amendes" class="btn btn-outline-light btn-sm">💰 Amendes</a>
            <form th:action="@{/logout}" method="post" style="display:inline-block;">
                <button type="submit" class="btn btn-outline-warning btn-sm">🚪 Déconnexion</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4" style="max-width: 700px;">

    <h1 class="mb-4">📤 Nouvel emprunt</h1>

    <div class="alert alert-info">
        ℹ️ Sélectionnez un livre et un membre. La date de retour sera automatiquement fixée à +14 jours.
    </div>

    <form th:action="@{/emprunts}" method="post">

        <div class="mb-3">
            <label class="form-label">Livre <span class="text-danger">*</span></label>
            <select name="livreId" class="form-select" required>
                <option value="">-- Choisir un livre --</option>
                <option th:each="livre : ${livres}" 
                        th:value="${livre.id}"
                        th:text="${livre.titre + ' — ' + livre.auteur}">
                    Titre — Auteur
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Emprunteur <span class="text-danger">*</span></label>
            <select name="utilisateurId" class="form-select" required>
                <option value="">-- Choisir un membre --</option>
                <option th:each="user : ${utilisateurs}" 
                        th:value="${user.id}"
                        th:text="${user.nom + ' (' + user.email + ')'}">
                    Nom (email)
                </option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">📤 Emprunter</button>
            <a href="/emprunts" class="btn btn-secondary">Annuler</a>
        </div>

    </form>

</div>

</body>
</html>
