<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvel emprunt</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-main fade-in">

    <div class="page-header" style="justify-content: center; text-align: center;">
        <div>
            <h1 class="page-title">📤 Nouvel emprunt</h1>
            <p class="page-subtitle">Créer un nouvel emprunt de livre</p>
        </div>
    </div>

    <div class="form-card">

        <div class="alert alert-info">
            ℹ️ La date de retour sera automatiquement fixée à <strong>+14 jours</strong>.
        </div>

        <form th:action="@{/emprunts}" method="post">

            <div class="form-grid">
                <div class="form-group full">
                    <label class="form-label">Livre <span style="color: var(--danger);">*</span></label>
                    <div class="input-icon" data-icon="📚">
                        <select name="livreId" class="form-select" required>
                            <option value="">-- Choisir un livre --</option>
                            <option th:each="livre : ${livres}"
                                    th:value="${livre.id}"
                                    th:text="${livre.titre + ' — ' + livre.auteur}">
                                Titre
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-group full">
                    <label class="form-label">Emprunteur <span style="color: var(--danger);">*</span></label>
                    <div class="input-icon" data-icon="👤">
                        <select name="utilisateurId" class="form-select" required>
                            <option value="">-- Choisir un membre --</option>
                            <option th:each="u : ${utilisateurs}"
                                    th:value="${u.id}"
                                    th:text="${u.nom + ' (' + u.email + ')'}">
                                Nom
                            </option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <a href="/emprunts" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-success">📤 Emprunter</button>
            </div>

        </form>

    </div>

</div>

<script th:replace="~{fragments/navbar :: themeScript}"></script>
</body>
</html>
