<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="login-card card p-4">

    <div class="text-center mb-4">
        <h1 class="h3 mb-2">📚 Bibliothèque</h1>
        <p class="text-muted">Connectez-vous pour continuer</p>
    </div>

    <!-- Message d'erreur -->
    <div class="alert alert-danger" th:if="${param.error}">
        ❌ Email ou mot de passe incorrect
    </div>

    <!-- Message de déconnexion -->
    <div class="alert alert-success" th:if="${param.logout}">
        ✅ Vous êtes déconnecté
    </div>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="username" class="form-control form-control-lg" 
                   placeholder="votre@email.com" required autofocus>
        </div>

        <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control form-control-lg" 
                   placeholder="Votre mot de passe" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">
            🔐 Se connecter
        </button>

    </form>

    <hr class="my-4">

    <div class="text-center small text-muted">
        <strong>Comptes de test :</strong><br>
        👤 alice@mail.com / Alice123!<br>
        👤 bob@mail.com / Bob12345!<br>
        🛠️ admin@biblio.com / Admin123!
    </div>

</div>

</body>
</html>
