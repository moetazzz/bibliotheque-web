<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif;
             background: #f4f6f9; padding: 40px 20px;">
    <table cellpadding="0" cellspacing="0" style="max-width: 600px; margin: 0 auto;
           background: white; border-radius: 16px; overflow: hidden;
           box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
        <tr>
            <td style="background: linear-gradient(135deg, #f59e0b, #d97706);
                       padding: 40px; text-align: center;">
                <div style="font-size: 60px; margin-bottom: 12px;">⏰</div>
                <h1 style="color: white; margin: 0; font-size: 26px;">
                    Rappel de retour
                </h1>
            </td>
        </tr>
        <tr>
            <td style="padding: 40px;">
                <p style="font-size: 16px; color: #333; margin: 0 0 20px;">
                    Bonjour <strong th:text="${nom}">Alice</strong>,
                </p>
                <p style="font-size: 16px; color: #555; line-height: 1.6; margin: 0 0 24px;">
                    Nous vous rappelons que le livre suivant doit être rendu prochainement :
                </p>

                <div style="background: #fef3c7; border-left: 4px solid #f59e0b;
                            padding: 20px; border-radius: 8px; margin-bottom: 24px;">
                    <p style="margin: 0 0 8px; font-size: 15px; color: #92400e;">
                        📖 <strong th:text="${livre}">Le Petit Prince</strong>
                    </p>
                    <p style="margin: 0; font-size: 14px; color: #92400e;">
                        À rendre avant le : <strong th:text="${dateRetour}">15/01/2026</strong>
                    </p>
                </div>

                <p style="font-size: 15px; color: #555; line-height: 1.6;">
                    Merci de le retourner dans les délais pour éviter une amende de retard.
                </p>
            </td>
        </tr>
        <tr>
            <td style="background: #f9fafb; padding: 24px; text-align: center;
                       color: #9ca3af; font-size: 13px;">
                📚 Bibliothèque Municipale — Système automatique
            </td>
        </tr>
    </table>
</body>
</html>
