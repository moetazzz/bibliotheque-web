<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Utilisateurs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">📚 Bibliothèque Municipale</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm">Accueil</a>
            <a href="/dashboard" class="btn btn-outline-light btn-sm">📊 Dashboard</a>
            <a href="/livres" class="btn btn-outline-light btn-sm">Livres</a>
            <a href="/utilisateurs" class="btn btn-outline-light btn-sm"
               th:if="${#authorization.expression('hasRole(''BIB'')')}">Utilisateurs</a>
            <a href="/emprunts" class="btn btn-outline-light btn-sm">Emprunts</a>
            <a href="/amendes" class="btn btn-outline-light btn-sm">💰 Amendes</a>
            <form th:action="@{/logout}" method="post" style="display:inline-block;">
                <button type="submit" class="btn btn-outline-warning btn-sm">🚪 Déconnexion</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="alert alert-success alert-dismissible fade show" th:if="${message}" role="alert">
        ✅ <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>👥 Liste des utilisateurs</h1>
        <a href="/utilisateurs/nouveau" class="btn btn-success">➕ Ajouter un utilisateur</a>
    </div>

    <form method="get" class="mb-3">
        <div class="input-group">
            <input type="text" name="recherche" th:value="${recherche}"
                   class="form-control" placeholder="Rechercher par nom...">
            <button class="btn btn-primary" type="submit">🔍 Rechercher</button>
        </div>
    </form>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Rôle</th>
                        <th>Solde amendes</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${utilisateurs}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.nom}">Alice</td>
                        <td th:text="${user.email}">alice@mail.com</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${user.role == 'BIB'} ? 'bg-warning text-dark' : 'bg-primary'"
                                  th:text="${user.roleLibelle}">Membre</span>
                        </td>
                        <td>
                            <span th:if="${user.soldeAmendes > 0}" class="text-danger fw-bold">
                                ⚠️ <span th:text="${#numbers.formatDecimal(user.soldeAmendes, 1, 2)}">0.00</span> €
                            </span>
                            <span th:unless="${user.soldeAmendes > 0}" class="text-success">0.00 €</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/utilisateurs/{id}/modifier(id=${user.id})}" 
                               class="btn btn-sm btn-warning">✏️</a>
                            <form th:action="@{/utilisateurs/{id}/supprimer(id=${user.id})}" 
                                  method="post" style="display:inline-block;"
                                  onsubmit="return confirm('Supprimer cet utilisateur ?');">
                                <button type="submit" class="btn btn-sm btn-danger">🗑️</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(utilisateurs)}" class="alert alert-info mt-3">
        📭 Aucun utilisateur trouvé.
    </p>

</div>

</body>
</html>
