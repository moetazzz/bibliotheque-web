<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilisateur</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-main fade-in">

    <div class="page-header" style="justify-content: center; text-align: center;">
        <div>
            <h1 class="page-title" th:text="${utilisateur.id != null ? '✏️ Modifier un utilisateur' : '➕ Ajouter un utilisateur'}">
                Ajouter un utilisateur
            </h1>
            <p class="page-subtitle">Créez un compte membre ou bibliothécaire</p>
        </div>
    </div>

    <div class="form-card">
        <form th:action="@{/utilisateurs}" th:object="${utilisateur}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-grid">
                <div class="form-group full">
                    <label class="form-label">Nom complet <span style="color: var(--danger);">*</span></label>
                    <div class="input-icon" data-icon="👤">
                        <input type="text" class="form-control" th:field="*{nom}"
                               placeholder="Ex : Alice Dupont">
                    </div>
                    <div style="color: var(--danger); font-size: 12px; margin-top: 4px;"
                         th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>

                <div class="form-group full">
                    <label class="form-label">Email <span style="color: var(--danger);">*</span></label>
                    <div class="input-icon" data-icon="📧">
                        <input type="email" class="form-control" th:field="*{email}"
                               placeholder="Ex : alice@mail.com">
                    </div>
                    <div style="color: var(--danger); font-size: 12px; margin-top: 4px;"
                         th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-group full">
                    <label class="form-label">Mot de passe <span style="color: var(--danger);">*</span></label>
                    <div class="input-icon" data-icon="🔒">
                        <input type="text" class="form-control" th:field="*{motDePasse}"
                               placeholder="Minimum 4 caractères">
                    </div>
                    <div style="color: var(--danger); font-size: 12px; margin-top: 4px;"
                         th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></div>
                    <small style="color: var(--text-muted); font-size: 12px;">
                        🔐 Sera hashé automatiquement (BCrypt)
                    </small>
                </div>

                <div class="form-group full">
                    <label class="form-label">Rôle <span style="color: var(--danger);">*</span></label>
                    <div class="input-icon" data-icon="🛡️">
                        <select class="form-select" th:field="*{role}">
                            <option value="">-- Choisir un rôle --</option>
                            <option value="MEMBRE">👤 Membre (peut emprunter)</option>
                            <option value="BIB">🛠️ Bibliothécaire (peut gérer)</option>
                        </select>
                    </div>
                    <div style="color: var(--danger); font-size: 12px; margin-top: 4px;"
                         th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                </div>
            </div>

            <div class="form-actions">
                <a href="/utilisateurs" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-success">💾 Enregistrer</button>
            </div>

        </form>
    </div>

</div>

<script th:replace="~{fragments/navbar :: themeScript}"></script>
</body>
</html>
