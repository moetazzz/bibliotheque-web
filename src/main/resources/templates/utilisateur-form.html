<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Utilisateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">📚 Bibliothèque Municipale</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm">Accueil</a>
            <a href="/dashboard" class="btn btn-outline-light btn-sm">📊 Dashboard</a>
            <a href="/livres" class="btn btn-outline-light btn-sm">Livres</a>
            <a href="/utilisateurs" class="btn btn-outline-light btn-sm">Utilisateurs</a>
            <a href="/emprunts" class="btn btn-outline-light btn-sm">Emprunts</a>
            <a href="/amendes" class="btn btn-outline-light btn-sm">💰 Amendes</a>
            <form th:action="@{/logout}" method="post" style="display:inline-block;">
                <button type="submit" class="btn btn-outline-warning btn-sm">🚪 Déconnexion</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4" style="max-width: 700px;">

    <h1 class="mb-4" th:text="${utilisateur.id != null ? '✏️ Modifier un utilisateur' : '➕ Ajouter un utilisateur'}">
        Ajouter un utilisateur
    </h1>

    <form th:action="@{/utilisateurs}" th:object="${utilisateur}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nom <span class="text-danger">*</span></label>
            <input type="text" class="form-control" th:field="*{nom}" placeholder="Ex : Alice Dupont">
            <div class="text-danger small" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email <span class="text-danger">*</span></label>
            <input type="email" class="form-control" th:field="*{email}" placeholder="Ex : alice@mail.com">
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Mot de passe <span class="text-danger">*</span></label>
            <input type="text" class="form-control" th:field="*{motDePasse}" placeholder="Minimum 4 caractères">
            <div class="text-danger small" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></div>
            <small class="text-muted">⚠️ Stocké en clair pour l'instant (BCrypt au Palier 8)</small>
        </div>

        <div class="mb-3">
            <label class="form-label">Rôle <span class="text-danger">*</span></label>
            <select class="form-select" th:field="*{role}">
                <option value="">-- Choisir --</option>
                <option value="MEMBRE">Membre</option>
                <option value="BIB">Bibliothécaire</option>
            </select>
            <div class="text-danger small" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">💾 Enregistrer</button>
            <a href="/utilisateurs" class="btn btn-secondary">Annuler</a>
        </div>

    </form>

</div>

</body>
</html>
