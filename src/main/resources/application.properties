spring.application.name=bibliotheque-web

# ===== PostgreSQL =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bibliotheque}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:biblio_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:BiblioApp2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== Serveur =====
server.port=${PORT:8080}

# ===== Thymeleaf =====
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===== Email =====
# Désactivé par défaut (mode LOG). Mettre MAIL_ENABLED=true pour activer.
mail.enabled=${MAIL_ENABLED:false}
mail.from=${MAIL_FROM:noreply@bibliotheque.com}

# Configuration SMTP (Gmail par défaut)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===== Tâches planifiées =====
# Activer les rappels automatiques
scheduling.enabled=${SCHEDULING_ENABLED:true}