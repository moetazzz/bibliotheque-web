spring.application.name=bibliotheque-web

# ===== PostgreSQL =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bibliotheque}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:biblio_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:BiblioApp2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== Serveur =====
server.port=${PORT:8080}

# ===== Thymeleaf =====
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html