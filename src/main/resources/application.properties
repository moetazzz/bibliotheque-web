spring.application.name=bibliotheque-web

# ===== PostgreSQL =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bibliotheque}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:biblio_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:BiblioApp2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Serveur =====
server.port=${PORT:8080}
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ===== Thymeleaf =====
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===== Logs (production = moins verbeux) =====
logging.level.bibliotheque=INFO
logging.level.org.hibernate.SQL=WARN

# ===== Sessions (sécurité) =====
server.servlet.session.timeout=30m

# ===== Email =====
mail.enabled=${MAIL_ENABLED:false}
mail.from=${MAIL_FROM:noreply@bibliotheque.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Tâches planifiées =====
scheduling.enabled=${SCHEDULING_ENABLED:true}