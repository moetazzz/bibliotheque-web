# ===== Nom de l'application =====
spring.application.name=bibliotheque-web

# ===== PostgreSQL (variables d'environnement avec valeurs par défaut) =====
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bibliotheque}
spring.datasource.username=${DATABASE_USERNAME:biblio_user}
spring.datasource.password=${DATABASE_PASSWORD:BiblioApp2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA (Hibernate) =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Serveur =====
server.port=${PORT:8080}

# ===== Thymeleaf =====
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===== Logs =====
logging.level.bibliotheque=INFO
logging.level.org.hibernate.SQL=WARN